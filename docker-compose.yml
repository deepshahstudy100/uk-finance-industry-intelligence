# Local deployment: PostgreSQL + API + scheduled ingestion worker + web UI.
#   cp .env.example .env && docker compose up --build
# UI: http://localhost:3000   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ukintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ukintel}
      POSTGRES_DB: ${POSTGRES_DB:-ukintel}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ukintel}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      UKINTEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ukintel}:${POSTGRES_PASSWORD:-ukintel}@db:5432/${POSTGRES_DB:-ukintel}
      RUN_MIGRATIONS: "1"
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 30
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      UKINTEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ukintel}:${POSTGRES_PASSWORD:-ukintel}@db:5432/${POSTGRES_DB:-ukintel}
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_BASEMAP_STYLE: ${NEXT_PUBLIC_BASEMAP_STYLE:-}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]
    restart: unless-stopped

volumes:
  pgdata:
