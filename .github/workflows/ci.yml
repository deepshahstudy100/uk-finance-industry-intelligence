name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ukintel
          POSTGRES_PASSWORD: ukintel
          POSTGRES_DB: ukintel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ukintel" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Unit, parser, ingestion and API tests (no network; recorded real payloads)
        run: python -m pytest -q
      - name: Migrations upgrade / downgrade / upgrade on PostgreSQL 16
        env:
          UKINTEL_DATABASE_URL: postgresql+psycopg://ukintel:ukintel@localhost:5432/ukintel
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build all images
        run: docker compose build
      - name: Smoke test the stack (demo mode, no ingestion)
        run: |
          docker compose up -d db api web
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && break; sleep 3; done
          curl -fs localhost:8000/api/meta
          for i in $(seq 1 40); do curl -fs localhost:3000/api/meta >/dev/null && break; sleep 3; done
          curl -fs -o /dev/null -w "web %{http_code}\n" localhost:3000/
      - if: always()
        run: docker compose logs --tail=80 api web
